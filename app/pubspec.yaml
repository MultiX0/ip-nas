name: nur
description: "Nur, my AI assistant app for a home NAS: chat with local or cloud models and voice calls with Fish Audio Drama 3."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  archive: ^4.5.2
  collection: ^1.19.1
  crypto: ^3.0.7
  desktop_drop: ^0.8.0
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_soloud: ^4.1.7
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  gpt_markdown: ^1.3.4
  image_picker: ^1.2.4
  intl: ^0.20.2
  lucide_icons_flutter: 4.0.0
  msgpack_dart: ^1.0.1
  multicast_dns: ^0.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.1.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
  shaders:
    - shaders/nur_orb.frag
    - shaders/nur_atmosphere.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
